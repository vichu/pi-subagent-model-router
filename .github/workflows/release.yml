name: Publish npm release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository == 'vichu/pi-subagent-model-router' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: node scripts/validate-release.mjs "$GITHUB_REF"
      # Bundled npm 11.19.1 rejects the current lockfile's optional
      # peer dependencies.
      - run: npm exec --yes --ignore-scripts --package=npm@11.6.2 -- npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish from the same commit without dependencies or files
      # from validation.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3' # Bundles npm 11.19.1 (OIDC requires 11.5.1+).
          package-manager-cache: false
      - run: >-
          npm publish --ignore-scripts --access public
          --registry=https://registry.npmjs.org/
